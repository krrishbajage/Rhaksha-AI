services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    volumes:
      - ./tests:/app/tests:ro
      - ./.env:/app/.env:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raksha
      POSTGRES_PASSWORD: raksha
      POSTGRES_DB: raksha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
